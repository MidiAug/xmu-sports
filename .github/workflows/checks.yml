name: Checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          architecture: x64
      - name: Check public tree
        run: python scripts/check_public_tree.py
      - run: npm ci
      - run: npm test
      - name: Release asset contract
        run: node scripts/test_release_assets.mjs
      - run: npm run build
      - name: Install worker test dependencies
        run: python -m pip install -r src-tauri/sidecars/http-booking/requirements-dev.txt
      - name: Worker offline tests
        working-directory: src-tauri/sidecars/http-booking
        run: python -m pytest -vv --timeout=30
      - name: Rust toolchain
        run: rustup toolchain install stable --profile minimal --no-self-update
      - name: Host unit tests
        run: cargo +stable test --locked --manifest-path src-tauri/Cargo.toml -p xmu-sports --lib
