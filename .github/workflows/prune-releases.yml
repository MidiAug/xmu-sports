name: Keep latest installer
on:
  release:
    types: [published]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: public-release-retention
  cancel-in-progress: false
jobs:
  prune:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Verify newest download before pruning older releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/prune_public_releases.py
