[package]
name = "vision-contracts"
version = "0.1.0"
edition = "2021"
description = "Versioned vision IPC, leases, frames, ActionPlan, CapabilityReport — no platform APIs"
license = "MIT"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
chrono = { version = "0.4", features = ["serde", "clock"] }
