[package]
name = "vision-pack"
version = "0.1.0"
edition = "2021"
description = "Recognition resource pack install / verify / rollback (models+templates, not optional booking)"
license = "MIT"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hex = "0.4"
thiserror = "2"

[dev-dependencies]
tempfile = "3"
hex = "0.4"
sha2 = "0.10"
