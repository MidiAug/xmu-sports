[package]
name = "vision-worker"
version = "0.1.0"
edition = "2021"
description = "Signed small vision worker — stdin/stdout IPC; default fake input"
license = "MIT"

[[bin]]
name = "vision-worker"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
vision-contracts = { path = "../vision-contracts" }
vision-core = { path = "../vision-core" }
vision-platform-api = { path = "../vision-platform-api" }
vision-pack = { path = "../vision-pack" }

[target.'cfg(windows)'.dependencies]
vision-platform-windows = { path = "../vision-platform-windows" }

[target.'cfg(target_os = "macos")'.dependencies]
vision-platform-macos = { path = "../vision-platform-macos" }
