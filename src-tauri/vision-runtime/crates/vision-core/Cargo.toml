[package]
name = "vision-core"
version = "0.1.0"
edition = "2021"
description = "Shared page state machine, slots, ActionPlan, Guard — no platform IDs"
license = "MIT"

[dependencies]
chrono = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
vision-contracts = { path = "../vision-contracts" }

[dev-dependencies]
vision-platform-api = { path = "../vision-platform-api" }
