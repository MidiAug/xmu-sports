[workspace]
resolver = "2"
members = [
  ".",
  "vision-runtime/crates/vision-contracts",
  "vision-runtime/crates/vision-core",
  "vision-runtime/crates/vision-platform-api",
  "vision-runtime/crates/vision-platform-windows",
  "vision-runtime/crates/vision-platform-macos",
  "vision-runtime/crates/vision-worker",
  "vision-runtime/crates/vision-pack",
]

[package]
name = "xmu-sports"
version = "0.1.32"
description = "XMU sports venue booking (Tauri)"
authors = ["xmu-sports"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12.28", default-features = false, features = ["blocking", "rustls-tls"] }
sha2 = "0.10.9"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
tauri-plugin-log = "2"
log = "0.4"
zip = { version = "2", default-features = false, features = ["deflate"] }
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Dwm",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Accessibility",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_HiDpi",
    "Win32_UI_Shell",
    "Win32_System_Com",
    "Win32_System_LibraryLoader",
    "Win32_System_Ole",
    "Win32_System_Variant",
    "Win32_System_Threading",
    "Win32_System_ProcessStatus",
    "Win32_System_SystemInformation",
    "Win32_Storage_FileSystem",
] }

[lib]
name = "xmu_sports_lib"
crate-type = ["staticlib", "cdylib", "rlib"]
